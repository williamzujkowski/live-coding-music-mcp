name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN — the build job only needs to
# read the repo. Individual jobs can elevate if they ever need to.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test:nocov -- --testPathIgnorePatterns="__tests__/browser/"

      # Jest runs this repo as CommonJS and @strudel/* is ESM, so every
      # StrudelEngine case in the unit tier runs against a mock. The
      # sandbox escapes (#229) and the memory containment (#307) are
      # therefore invisible to `npm test` by construction — which is why
      # this script exists, and why it not being in CI meant nothing ever
      # ran it.
      - name: Verify sandbox and memory containment
        run: npm run test:sandbox

      - name: Test MCP server initialization
        run: |
          # Test that the server can start and respond to basic requests
          timeout 5s node dist/index.js < /dev/null || true
          echo '{"jsonrpc":"2.0","method":"tools/list","id":1}' | timeout 5s node dist/index.js > test_output.json || true
          
          # Check if we got a valid response
          if [ -f test_output.json ]; then
            cat test_output.json | grep -q '"jsonrpc":"2.0"' && echo "✓ Server responds to JSON-RPC" || exit 1
            cat test_output.json | grep -q '"tools"' && echo "✓ Tools list returned" || exit 1
          else
            echo "✗ Server did not produce output"
            exit 1
          fi
      
      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify tool documentation freshness
        run: npx tsx scripts/generate-tool-docs.ts check

      - name: Verify required files exist
        run: |
          test -f dist/index.js || exit 1
          test -f dist/StrudelController.js || exit 1
          test -f dist/AudioAnalyzer.js || exit 1
          test -f dist/PatternStore.js || exit 1
          echo "✓ All required files built successfully"
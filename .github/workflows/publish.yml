name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Required for OIDC trusted publishing and build provenance attestation
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Environment is optional but recommended for additional protection
    # Configure this environment in GitHub repo settings if desired
    environment: npm-publish
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # OIDC trusted publishing needs npm >= 11.5.1. Node 22 bundles npm
      # 10.x and `npm install -g npm@latest` self-corrupts mid-upgrade
      # (MODULE_NOT_FOUND: promise-retry). Node 24 ships npm 11.x natively,
      # so we pin the publish job to Node 24 and skip the upgrade entirely.
      # CI (ci.yml) still runs on 22 — this job builds + tests before
      # publishing, so a 24-only regression would be caught here too.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          if [ "$(printf '%s\n' "11.5.1" "$NPM_VERSION" | sort -V | head -n1)" = "11.5.1" ]; then
            echo "npm version is sufficient for OIDC trusted publishing"
          else
            echo "::error::npm $NPM_VERSION is below the 11.5.1 required for OIDC trusted publishing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:nocov -- --testPathIgnorePatterns="browser"

      - name: Version bump (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version ${{ github.event.inputs.version }} -m "Release v%s [skip ci]"
          git push
          git push --tags

      # Publish with provenance using OIDC trusted publishing
      # If trusted publisher is configured on npmjs.com, no NPM_TOKEN needed
      # Falls back to NPM_TOKEN if trusted publishing isn't configured
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          # NPM_TOKEN is optional when using OIDC trusted publishing
          # Keep it as fallback for transition period
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pack the tarball so we can attest + attach it to the GitHub release.
      # `npm pack` runs the `prepare` hook (npm run build), whose generator
      # script prints to stdout — so parsing npm's output (even --json) is
      # fragile. Instead, just glob for the .tgz it produces: npm pack
      # creates exactly one, named deterministically from package.json.
      - name: Pack tarball for attestation
        id: pack
        run: |
          rm -f ./*.tgz
          npm pack >/dev/null 2>&1
          TARBALL=$(ls -1 ./*.tgz | head -n1)
          test -n "${TARBALL}" && test -f "${TARBALL}" || { echo "::error::npm pack produced no .tgz"; exit 1; }
          echo "tarball=${TARBALL#./}" >> "$GITHUB_OUTPUT"
          echo "Packed: ${TARBALL}"

      # GitHub-native SLSA build provenance on the published tarball —
      # independent of npm's publish provenance so consumers can verify
      # via either GitHub or the npm registry.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # SBOM via npm's built-in generator (SPDX + CycloneDX formats).
      # Consumers can audit the dependency tree without cloning.
      - name: Generate SBOM (SPDX)
        run: npm sbom --sbom-format=spdx > sbom.spdx.json

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      # Attach SBOMs and tarball to the GitHub release for release events.
      # Manual workflow_dispatch runs skip this since there's no release to attach to.
      - name: Attach artifacts to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.tarball }}" \
            sbom.spdx.json \
            sbom.cdx.json \
            --clobber

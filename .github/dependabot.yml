version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # Docker base image is pinned by SHA — Dependabot bumps the digest when
  # node:22-alpine moves so the pin doesn't go stale.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
